<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Gallery - Homework</title>

    <style>
         body{
        background-color: #f5aaaa;
        justify-content: center;

       }
       .cover{
        width: 80%;
        margin: auto;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
       }
       .cart{
        width: 300px;
        height: 200px;
        overflow: hidden;
        box-shadow: 1px 1px 10px 1px gray;
        border-radius: 20px;
        transition: all 0.5s ease;
        }
        .cart img{
        width: 100%;
        height: 100%;
        object-fit: cover;
       }
       .cart:hover{
        transform: scale(1);
        rotate: -5deg;
       }
    </style>
</head>
<body>
    <h1>USA Photos</h1>

<div class="cart">
    <a href="./usa1.jpeg" target="_blank">
    <img src="./usa1.jpeg" alt="USA Photo 1" >
    </a>
</div>
    


<div class="cart">
    <a href="./usa2.jpeg" target="_blank">
    <img src="./usa2.jpeg" alt="USA Photo 2">
    </a>
</div>
    

<div class="cart">
    <a href="./usa3.jpeg" target="_blank">
    <img src="./usa3.jpeg" alt="USA Photo 3">
    </a>
</div>     


<div class="cart">
    <a href="./usa4.jpeg" target="_blank">
    <img src="./usa4.jpeg" alt="USA Photo 4" ">
    </a>
</div>



<div class="cart">
    <a href="./usa5.jpeg" target="_blank">
    <img src="./usa5.jpeg" alt="USA Photo 5">
    </a>
</div>


</body>
</html>
