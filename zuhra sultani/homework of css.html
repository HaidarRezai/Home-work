<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #050505;
}

.circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 100px auto;
  animation: beatRGB 1.2s infinite ease-in-out;
}

@keyframes beatRGB {
  0% {
    transform: scale(1);
    background: radial-gradient(circle, #00f2fe, #0040ff);
    box-shadow: 0 0 20px #00f2fe;
  }
  33% {
    transform: scale(1.3);
    background: radial-gradient(circle, #00ff9d, #008f5a);
    box-shadow: 0 0 40px #00ff9d;
  }
  66% {
    transform: scale(1.3);
    background: radial-gradient(circle, #ff3b3b, #8b0000);
    box-shadow: 0 0 40px #ff3b3b;
  }
  100% {
    transform: scale(1);
    background: radial-gradient(circle, #00f2fe, #0040ff);
    box-shadow: 0 0 20px #00f2fe;
  }
}
</style>
</head>
<body>

<div class="circle"></div>

</body>
</html>
