<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        form{
            width: 50%;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input{
            padding: 10px;
        }
        div{
            display: grid;
            grid-template-columns: 80px auto;
            align-items: center;
        }
        input,select,textarea{
            border:none;
            outline: none;
            box-shadow: 1px 1px 5px 1px gray;
            border-radius: 20px;
            padding:10px 20px;
        }
    </style>
</head>
<body>
   <!-- Data student
    Data type Number String Boolean  file  0-9  A-Z ا - ی  True False

    1 Fullname  Ali Omid Farid Zahra   String
    2 Age       20  number
    3 Photo     file
    4 email     string  
    5 gender    string Male Female
    6 f/name    string
    7 Status    boolean False True


    input text
    text 
    number 
    boolean
    file

    form input lable select textaira

    input type placeholder
   
    CTRL + /
   -->

   <form action="#" method="post">
    <div>
        <label for="gender">Gender</label>
        <select name="" id="gender">
            <option value="">Male</option>
            <option value="">Female</option>
        </select>
    </div>
    <div>
        <label for="message">message</label>
        <textarea name="" id="message" rows="5"></textarea>
    </div>
    <div>
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" placeholder="Enter your Full name" name="fullname" required>
    </div>
    <div>
        <label for="age">Age</label>
        <input type="number" id="age" max="60" min="18" placeholder="Enter your Age" required>
    </div>
    <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your Email" required>
    </div>
    <div>
        <label for="photo">Photo</label>
        <input type="file" id="photo" name="photo" required>
    </div>
    <div>
        <label for="dob">DOB</label>
        <input type="date" id="dob" name="dob">
    </div>
    
    <input type="submit" value="Save ✌️">
   </form>
</body>
</html>
